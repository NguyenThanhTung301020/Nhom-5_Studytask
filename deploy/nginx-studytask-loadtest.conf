# Bản chạy RIÊNG để kiểm tải, tách khỏi trang thật (docs/van-hanh/10-du-lieu-kiem-tai-tu-khung-dao-tao.md).
# - Cổng 8081, API riêng ở 127.0.0.1:8788, dữ liệu riêng ở /var/lib/studytask-loadtest.
# - KHÔNG đưa cổng này vào Cloudflare Tunnel: tài khoản kiểm tải dùng mật khẩu đoán được (student123, teacher123, ...).
#   Chỉ mở cho máy phát tải trong mạng nội bộ (vd: sudo ufw allow from 192.168.1.0/24 to any port 8081).
# Cài:  sudo cp deploy/nginx-studytask-loadtest.conf /etc/nginx/sites-available/studytask-loadtest
#       sudo ln -s /etc/nginx/sites-available/studytask-loadtest /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8081;
    server_name _;

    client_max_body_size 30m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
    }

    # Tệp tài liệu do seed_curriculum.py tạo (giống location /uploads/ của bản thật, nhưng trỏ sang thư mục kiểm tải)
    location ^~ /uploads/ {
        alias /var/lib/studytask-loadtest/uploads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=604800";
    }
}
