name: CI

on:
  pull_request:          # mọi PR, kể cả PR xếp chồng có base là nhánh khác (trước đây chỉ PR vào master nên PR xếp chồng không chạy CI)
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Firestore Emulator cần Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Lưu tệp .jar của Emulator để lần sau khỏi tải lại
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run test:logic
      - run: npm run test:rules

  # Máy chủ thay Firebase (server/studytask_api.py): chỉ dùng thư viện chuẩn của Python, không cần cài gì thêm
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chuyển tài khoản email → tên đăng nhập
        run: python3 tests/server/test_migrate.py
      - name: Tài khoản, email cá nhân, quên mật khẩu, ảnh đại diện, chat realtime
        run: python3 tests/server/test_account.py
      - name: Email cá nhân – xác minh không ghi đè tài khoản khác; mã đặt lại mất hiệu lực khi gỡ/đổi email
        run: python3 tests/server/test_email_codes.py
      - name: Gỡ email cá nhân là một giao dịch – quyền, chưa liên kết, lỗi CSDL/COMMIT thì hoàn tác trọn (PR50, việc 12)
        run: python3 tests/server/test_unlink_email.py
      - name: SV/GV chỉ tự sửa email và số điện thoại; hồ sơ học vụ do Admin cấp
        run: python3 tests/server/test_profile_lock.py
      - name: V4 – giới hạn đọc và kiểm tra khi ghi activities
        run: python3 tests/server/test_activities.py
      - name: Tạo và đăng nhập tài khoản theo tên đăng nhập
        run: python3 tests/server/test_users.py
      - name: Admin đặt lại mật khẩu (quyền, thu hồi phiên, không lưu văn bản thường)
        run: python3 tests/server/test_admin_reset.py
      - name: V3 – Trắc nghiệm không lộ đáp án, máy chủ chấm điểm
        run: python3 tests/server/test_quiz_v3.py
      - name: Điểm chính thức cho Bảng điểm và Báo cáo lớp (chưa có kết quả, chưa làm, nộp lại, nhật ký bị sửa/mất)
        run: python3 tests/server/test_quiz_results_nguon_diem.py
      - name: Trắc nghiệm điền khuyết, bản lưu khi mở đề, kho đề
        run: python3 tests/server/test_quiz_extra.py
      - name: Phân quyền đọc dữ liệu dùng chung theo môn (việc 14)
        run: python3 tests/server/test_shared_scope.py
      - name: Giáo viên không làm mất dữ liệu môn khác khi ghi dữ liệu dùng chung (R1)
        run: python3 tests/server/test_teacher_shared.py
      - name: Bớt/xóa môn còn dữ liệu bị chặn hẳn (R2, R4 review PR9)
        run: python3 tests/server/test_subject_removal.py
      - name: Dữ liệu kiểm tải từ khung đào tạo (lớp 20–30 SV, mật khẩu mặc định, purge)
        run: python3 tests/server/test_seed_curriculum.py
      - name: Lọc theo lớp học phần – sinh viên chỉ thấy lịch lớp mình, giáo viên chỉ thấy và sửa lớp mình dạy
        run: python3 tests/server/test_class_scope.py
      - name: Gán ảnh đại diện hàng loạt (tệp riêng mỗi sinh viên, không đè ảnh tự đặt, gỡ và purge dọn sạch)
        run: python3 tests/server/test_assign_avatars.py
      - name: Bộ ảnh đại diện tự vẽ (đủ số lượng, không trùng, không dùng ảnh của bên thứ ba)
        run: python3 tests/server/test_generate_avatars.py
      - name: Mỗi học phần mở chỉ có 1–3 giáo viên được cấp quyền (máy chủ chặn người thứ 4)
        run: python3 tests/server/test_teacher_limit.py
      - name: Thi trực tuyến trên trang (mã truy cập, vào phòng thi theo giờ, không lộ câu hỏi ngoài phòng thi)
        run: python3 tests/server/test_online_exam.py
      - name: Link minh chứng của phiếu xét tốt nghiệp
        run: python3 tests/server/test_graduation.py
      - name: Nhập danh sách lớp (chỉ Admin và Phòng Đào tạo, trùng thì bỏ qua, không ghi đè)
        run: python3 tests/server/test_import_students.py
      - name: Dọn dữ liệu cũ (chỉ Admin, chỉ học phần đã kết thúc ngoài khoảng hiển thị, xóa trọn dữ liệu đi kèm, giữ tệp dùng chung, không sống lại)
        run: python3 tests/server/test_old_data.py
      - name: Nộp bài theo định dạng giáo viên chọn
        run: bash tests/server/test_submit.sh
      - name: Sao lưu có PDF kho sách, không có sách đã gỡ; thử khôi phục bắt được bản thiếu hoặc hỏng PDF
        run: bash tests/server/test_backup_library.sh
