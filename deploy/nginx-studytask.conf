server {
    listen 80;
    server_name sutdytask.io.vn;

    root /var/www/studytask;
    index index.html;

    client_max_body_size 30m;

    # API (Python, 127.0.0.1:8787)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_request_buffering on;
    }

    # Bài nộp của sinh viên: không phục vụ trực tiếp; API kiểm tra đăng nhập, chỉ người nộp và nhân viên mở được
    location ^~ /uploads/submissions/ {
        rewrite ^/uploads/submissions/(.*)$ /api/files/submissions/$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Visitor $http_cf_visitor;
    }

    # File người dùng tải lên (ảnh, pdf, ...)
    location ^~ /uploads/ {
        alias /var/lib/studytask/uploads/;
        charset utf-8;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Không bao giờ phục vụ tệp/thư mục ẩn (.git, .env, .gitignore...). Phải đặt TRƯỚC các location regex bên dưới.
    # (10/11/2026: smoke_live.py phát hiện /var/www/studytask/.git của bản clone cũ đang được phục vụ công khai.)
    location ~ /\. {
        return 404;
    }

    # Mã nguồn luôn kiểm tra lại để cập nhật có hiệu lực ngay
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Ảnh/phông tĩnh của giao diện
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
