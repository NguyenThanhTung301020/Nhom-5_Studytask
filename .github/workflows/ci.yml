name: CI

on:
  pull_request:          # mọi PR, kể cả PR xếp chồng có base là nhánh khác (trước đây chỉ PR vào master nên PR xếp chồng không chạy CI)
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Firestore Emulator cần Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Lưu tệp .jar của Emulator để lần sau khỏi tải lại
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run test:logic
      - run: npm run test:rules

  # Máy chủ thay Firebase (server/studytask_api.py): chỉ dùng thư viện chuẩn của Python, không cần cài gì thêm
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chuyển tài khoản email → tên đăng nhập
        run: python3 tests/server/test_migrate.py
      - name: Tài khoản, email cá nhân, quên mật khẩu, ảnh đại diện, chat realtime
        run: python3 tests/server/test_account.py
      - name: Email cá nhân – xác minh không ghi đè tài khoản khác; mã đặt lại mất hiệu lực khi gỡ/đổi email
        run: python3 tests/server/test_email_codes.py
      - name: SV/GV chỉ tự sửa email và số điện thoại; hồ sơ học vụ do Admin cấp
        run: python3 tests/server/test_profile_lock.py
      - name: V4 – giới hạn đọc và kiểm tra khi ghi activities
        run: python3 tests/server/test_activities.py
      - name: Tạo và đăng nhập tài khoản theo tên đăng nhập
        run: python3 tests/server/test_users.py
      - name: Admin đặt lại mật khẩu (quyền, thu hồi phiên, không lưu văn bản thường)
        run: python3 tests/server/test_admin_reset.py
      - name: V3 – Trắc nghiệm không lộ đáp án, máy chủ chấm điểm
        run: python3 tests/server/test_quiz_v3.py
      - name: Trắc nghiệm điền khuyết, bản lưu khi mở đề, kho đề
        run: python3 tests/server/test_quiz_extra.py
      - name: Phân quyền đọc dữ liệu dùng chung theo môn (việc 14)
        run: python3 tests/server/test_shared_scope.py
      - name: Giáo viên không làm mất dữ liệu môn khác khi ghi dữ liệu dùng chung (R1)
        run: python3 tests/server/test_teacher_shared.py
      - name: Link minh chứng của phiếu xét tốt nghiệp
        run: python3 tests/server/test_graduation.py
      - name: Nộp bài theo định dạng giáo viên chọn
        run: bash tests/server/test_submit.sh
